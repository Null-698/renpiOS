name: iOS builds

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build reniOS with Xcode 27
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Prepare bundled Ren’Py engines
        run: python3 Scripts/prepare.py 8.6.0 --legacy
      - name: Build unsigned iPhone archive
        run: bash Scripts/package.sh
      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: reniOS-IPA
          path: out/reniOS-unsigned.ipa
          if-no-files-found: error
      - name: Build the shared simulator app
        run: |
          bash Scripts/build-simulator.sh
          ditto -c -k --keepParent .build/simulator/Build/Products/Debug-iphonesimulator/reniOS.app out/reniOS-simulator.zip
      - name: Upload shared simulator app
        uses: actions/upload-artifact@v4
        with:
          name: reniOS-simulator
          path: out/reniOS-simulator.zip
          if-no-files-found: error

  test:
    name: Playback · iOS ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: '26'
            runner: macos-26
          - os: '27'
            runner: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        if: matrix.os == '26'
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n1)
          test -n "$xcode"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: reniOS-simulator
          path: out
      - name: Test imports, save restore, keyboard, and Close
        run: |
          ditto -x -k out/reniOS-simulator.zip out
          bash Scripts/simulator.sh "${{ matrix.os }}" "$PWD/out/reniOS.app"
      - name: Upload keyboard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-iOS-${{ matrix.os }}
          path: |
            out/library-probe*.json
            out/keyboard.png
            out/keyboard-probe*.json
            out/quit-probe*.json
            out/diagnostics/
          if-no-files-found: ignore
